[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-load"
version = "0.1.0"
description = "A reusable ELT framework for extracting, loading, and transforming data"
requires-python = ">=3.10"
dependencies = [
    "oracledb>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
elt = "elt.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
